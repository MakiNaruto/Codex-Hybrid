# Use a provider that supports the Responses API.
# Replace the placeholder base URL, key and model ID before enabling.
version: 1
# default_model: custom/default
providers:
  custom:
    enabled: false
    protocol: openai_responses
    base_url: https://api.example.com/v1
    credentials:
      api_key_env: CONNECTED_API_KEY
    models:
      default:
        enabled: false
        model_id: your-model-id
        display_name: Responses Model
